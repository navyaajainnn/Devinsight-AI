<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DevInsight AI - PR Summarizer</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      max-width: 700px;
      margin: 60px auto;
      padding: 0 20px;
      color: #1a1a1a;
    }
    h1 { font-size: 1.4rem; }
    input {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
    }
    #result {
      margin-top: 30px;
      white-space: pre-wrap;
      background: #f5f5f5;
      padding: 15px;
      border-radius: 6px;
      display: none;
    }
    #loading { display: none; margin-top: 20px; color: #666; }
    #testLoading { display: none; margin-top: 20px; color: #666; }
    #testResult {
      margin-top: 20px;
      display: none;
    }
    #testResult pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.9rem;
    }
    .test-notes {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #666;
      font-style: italic;
    }
    .risk-low { color: #1a7a1a; }
    .risk-medium { color: #b8860b; }
    .risk-high { color: #b00020; }
  </style>
</head>
<body>
  <h1>DevInsight AI &mdash; PR Summarizer</h1>
  <p>Paste a public GitHub PR URL to get an AI-generated summary.</p>

  <input id="prUrl" type="text" placeholder="https://github.com/owner/repo/pull/123" />
  <button id="submitBtn">Summarize</button>
  <button id="testBtn">Generate Tests</button>

  <div id="loading" style="display:none;">Analyzing PR, this can take a few seconds...</div>
  <div id="result"></div>

  <div id="testLoading" style="display:none;">Generating tests, this can take a few seconds...</div>
  <div id="testResult"></div>

  <script>
    const submitBtn = document.getElementById("submitBtn");
    const resultDiv = document.getElementById("result");
    const loadingDiv = document.getElementById("loading");
    const prUrlInput = document.getElementById("prUrl");

    const testBtn = document.getElementById("testBtn");
    const testResultDiv = document.getElementById("testResult");
    const testLoadingDiv = document.getElementById("testLoading");

    testBtn.addEventListener("click", async () => {
      const prUrl = prUrlInput.value.trim();
      if (!prUrl) {
        alert("Please paste a PR URL first.");
        return;
      }

      testResultDiv.style.display = "none";
      testLoadingDiv.style.display = "block";
      testBtn.disabled = true;

      try {
        const response = await fetch("/generate-tests", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pr_url: prUrl }),
        });

        const data = await response.json();

        if (!response.ok) {
          testResultDiv.innerHTML = `<strong>Error:</strong> ${data.detail}`;
        } else if (!data.test_code) {
          testResultDiv.innerHTML = `<p><em>${data.notes}</em></p>`;
        } else {
          const escaped = data.test_code
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

          testResultDiv.innerHTML = `
            <strong>Generated ${data.language} tests</strong> (covers: ${data.functions_covered.join(", ") || "n/a"})
            <pre><code>${escaped}</code></pre>
            <p class="test-notes">${data.notes}</p>
          `;
        }

        testResultDiv.style.display = "block";
      } catch (err) {
        testResultDiv.innerHTML = `<strong>Error:</strong> Could not reach the server.`;
        testResultDiv.style.display = "block";
      } finally {
        testLoadingDiv.style.display = "none";
        testBtn.disabled = false;
      }
    });

    submitBtn.addEventListener("click", async () => {
      const prUrl = prUrlInput.value.trim();
      if (!prUrl) {
        alert("Please paste a PR URL first.");
        return;
      }

      resultDiv.style.display = "none";
      loadingDiv.style.display = "block";
      submitBtn.disabled = true;

      try {
        const response = await fetch("/summarize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pr_url: prUrl }),
        });

        const data = await response.json();

        if (!response.ok) {
          resultDiv.innerHTML = `<strong>Error:</strong> ${data.detail}`;
        } else {
          const riskClass = "risk-" + data.risk_level;
          const issuesHtml = data.issues.length === 0
            ? "<p>No issues found.</p>"
            : `<ul>${data.issues.map(i =>
                `<li><strong>[${i.severity.toUpperCase()}]</strong> ${i.description} <em>(confidence: ${i.confidence})</em></li>`
              ).join("")}</ul>`;

          const truncatedNotice = data.diff_truncated
            ? `<p style="color:#b8860b;"><em>Note: this PR's diff was too large to fully analyze; results are based on a partial diff.</em></p>`
            : "";

          resultDiv.innerHTML = `
            ${truncatedNotice}
            <strong>Summary:</strong> ${data.summary}<br><br>
            <strong>Risk level:</strong> <span class="${riskClass}">${data.risk_level}</span><br>
            <strong>Files changed:</strong> ${data.files_changed}<br><br>
            <strong>Key changes:</strong>
            <ul>${data.key_changes.map(c => `<li>${c}</li>`).join("")}</ul>
            <strong>Potential issues:</strong>
            ${issuesHtml}
          `;
        }

        resultDiv.style.display = "block";
      } catch (err) {
        resultDiv.innerHTML = `<strong>Error:</strong> Could not reach the server.`;
        resultDiv.style.display = "block";
      } finally {
        loadingDiv.style.display = "none";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
